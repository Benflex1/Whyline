name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      # actions/checkout v6.0.0
      - name: Check out source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3

      # actions/setup-node v6.0.0
      - name: Set up Node.js 24
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check

      - name: Check diff whitespace
        run: git diff --check

      - name: Accept the installed npm package
        run: npm run package:acceptance

  git-2-36-compatibility:
    name: Git 2.36.6 compatibility
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v6.0.0
      - name: Check out source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3

      # actions/setup-node v6.0.0
      - name: Set up Node.js 24
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci

      - name: Install Git build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential zlib1g-dev

      - name: Build Git 2.36.6 from the pinned upstream commit
        shell: bash
        run: |
          set -euo pipefail
          git_source_commit=ecaa3db17183b4a3895ccd0c0c1af01d0e6fed45
          git_source_sha256=40308ff4416d2c4be7bb1dfa86094140dd693e22287e4f53347ca7d87952f7c9
          git_source_archive="$RUNNER_TEMP/git-2.36.6.tar.gz"
          git_prefix="$RUNNER_TEMP/git-2.36.6"
          curl --fail --location --retry 3 --output "$git_source_archive" "https://github.com/git/git/archive/${git_source_commit}.tar.gz"
          echo "$git_source_sha256  $git_source_archive" | sha256sum --check
          tar -xzf "$git_source_archive" -C "$RUNNER_TEMP"
          git_source_directory="$RUNNER_TEMP/git-${git_source_commit}"
          make -C "$git_source_directory" -j2 all NO_CURL=YesPlease NO_GETTEXT=YesPlease NO_TCLTK=YesPlease
          make -C "$git_source_directory" install prefix="$git_prefix" NO_CURL=YesPlease NO_GETTEXT=YesPlease NO_TCLTK=YesPlease
          "$git_prefix/bin/git" --version
          echo "$git_prefix/bin" >> "$GITHUB_PATH"

      - name: Verify the selected Git executable
        shell: bash
        run: |
          set -euo pipefail
          test "$(command -v git)" = "$RUNNER_TEMP/git-2.36.6/bin/git"
          test "$(git --version)" = "git version 2.36.6"

      - name: Check diff whitespace
        run: git diff --check

      - name: Accept the installed package with Git 2.36.6
        run: node scripts/package-acceptance.mjs --expected-git-version 2.36.6
